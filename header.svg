<svg width="100%" height="100%" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0C121F" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <!-- Subtle Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3" />
    </linearGradient>

    <!-- High-End Typography Title Vertical Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Top Badge Border Gradient -->
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Ambient Lights -->
    <filter id="ambientLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <!-- Pulse Glow -->
    <filter id="emeraldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      font-size: 35px;
      font-weight: 800;
      letter-spacing: 4px;
      fill: url(#titleGrad);
    }
    .sub-role {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
      font-size: 13.5px;
      font-weight: 400;
      letter-spacing: 0.8px;
      fill: #94A3B8;
    }
    .chip-label {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', ui-monospace, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.3px;
      fill: #E2E8F0;
    }
  </style>

  <!-- Base Card Body -->
  <rect x="0" y="0" width="900" height="220" rx="16" fill="url(#cardBg)" />

  <!-- Ambient Glow Reflections -->
  <circle cx="450" cy="15" r="140" fill="#38BDF8" fill-opacity="0.06" filter="url(#ambientLight)" />
  <circle cx="150" cy="110" r="110" fill="#6366F1" fill-opacity="0.03" filter="url(#ambientLight)" />
  <circle cx="750" cy="110" r="110" fill="#0EA5E9" fill-opacity="0.03" filter="url(#ambientLight)" />

  <!-- Outer Glass Border -->
  <rect x="0.75" y="0.75" width="898.5" height="218.5" rx="15.25" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Top Status Badge: Minimalist Pill -->
  <g transform="translate(450, 36)">
    <rect x="-185" y="-13" width="370" height="26" rx="13" fill="#0B1324" fill-opacity="0.8" stroke="url(#badgeBorder)" stroke-width="0.8" />
    <!-- Glowing Status Indicator Dot -->
    <circle cx="-160" cy="0" r="3.5" fill="#10B981" filter="url(#emeraldGlow)" />
    <circle cx="-160" cy="0" r="1.8" fill="#E6FFFA" />
    <text x="-148" y="3.5" text-anchor="start" class="badge-text">
      <tspan fill="#38BDF8">FOUNDER @ A-ZENTRIX</tspan>
      <tspan fill="#64748B" dx="6">|</tspan>
      <tspan fill="#94A3B8" dx="6">AI SYSTEMS ARCHITECT</tspan>
    </text>
  </g>

  <!-- Name Title -->
  <text x="450" y="98" text-anchor="middle" class="name-title">A S MOHAMED ARFEEN</text>

  <!-- Professional Subtitle -->
  <text x="450" y="130" text-anchor="middle" class="sub-role">Autonomous Agent Runtimes  •  LLM Adaptation &amp; DPO  •  Distributed Systems</text>

  <!-- Minimalist Focus Chips -->
  <g transform="translate(450, 175)">
    <!-- Chip 1: AgentIR Architecture -->
    <g transform="translate(-327, 0)">
      <rect x="-87" y="-13" width="174" height="26" rx="7" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B" stroke-width="0.9" />
      <circle cx="-68" cy="0" r="3" fill="#38BDF8" />
      <text x="-56" y="3.5" text-anchor="start" class="chip-label">AgentIR Framework</text>
    </g>

    <!-- Chip 2: LoRA & DPO Alignment -->
    <g transform="translate(-109, 0)">
      <rect x="-87" y="-13" width="174" height="26" rx="7" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B" stroke-width="0.9" />
      <circle cx="-68" cy="0" r="3" fill="#A855F7" />
      <text x="-56" y="3.5" text-anchor="start" class="chip-label">LoRA &amp; DPO Tuning</text>
    </g>

    <!-- Chip 3: High-Throughput Backends -->
    <g transform="translate(109, 0)">
      <rect x="-87" y="-13" width="174" height="26" rx="7" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B" stroke-width="0.9" />
      <circle cx="-68" cy="0" r="3" fill="#10B981" />
      <text x="-56" y="3.5" text-anchor="start" class="chip-label">FastAPI Microservices</text>
    </g>

    <!-- Chip 4: Hackapolooza '25 Champion -->
    <g transform="translate(327, 0)">
      <rect x="-87" y="-13" width="174" height="26" rx="7" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B" stroke-width="0.9" />
      <circle cx="-68" cy="0" r="3" fill="#F59E0B" />
      <text x="-56" y="3.5" text-anchor="start" class="chip-label">Hackapolooza '25 🏆</text>
    </g>
  </g>
</svg>
