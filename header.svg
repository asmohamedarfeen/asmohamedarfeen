<svg width="100%" height="100%" viewBox="0 0 900 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2F8FF" />
      <stop offset="100%" stop-color="#00F7FF" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F7FF" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Helvetica Neue', sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 2px;
      fill: url(#titleGrad);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, 'Helvetica Neue', sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #00F7FF;
      text-transform: uppercase;
    }
    .role-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, 'Helvetica Neue', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      fill: #8BB2DE;
    }
    .pill-text {
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      fill: #6EE7B7;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Card Background -->
  <rect width="900" height="230" rx="14" fill="url(#bgGradient)" />
  <rect width="900" height="230" rx="14" fill="url(#techGrid)" />
  <rect width="900" height="230" rx="14" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Background Ambient Glow Circles -->
  <circle cx="820" cy="40" r="140" fill="#0088FF" fill-opacity="0.08" filter="url(#subtleGlow)" />
  <circle cx="80" cy="190" r="120" fill="#00F7FF" fill-opacity="0.06" filter="url(#subtleGlow)" />

  <!-- Top Badge: Founder @ A-Zentrix -->
  <g transform="translate(450, 42)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="url(#badgeGrad)" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="-116" cy="0" r="4" fill="#00F7FF" />
    <text x="-104" y="4" text-anchor="start" class="badge-text">⚡ Founder @ A-Zentrix</text>
  </g>

  <!-- Name Title -->
  <text x="450" y="105" text-anchor="middle" class="name-title">A S MOHAMED ARFEEN</text>

  <!-- Professional Subtitle -->
  <text x="450" y="138" text-anchor="middle" class="role-title">AI Systems Architect  •  LLM &amp; Backend Engineer  •  Building Intelligent Products</text>

  <!-- Bottom Tech Focus Pills -->
  <g transform="translate(450, 180)">
    <!-- Pill 1: Autonomous Agents -->
    <rect x="-345" y="-12" width="160" height="24" rx="6" fill="#0c182b" stroke="#00F7FF" stroke-width="0.8" stroke-opacity="0.3" />
    <text x="-265" y="4" text-anchor="middle" class="pill-text">🤖 Autonomous Agents</text>

    <!-- Pill 2: FastAPI & Systems -->
    <rect x="-170" y="-12" width="160" height="24" rx="6" fill="#0c182b" stroke="#0088FF" stroke-width="0.8" stroke-opacity="0.3" />
    <text x="-90" y="4" text-anchor="middle" class="pill-text">⚡ FastAPI Backends</text>

    <!-- Pill 3: Production LLMs -->
    <rect x="5" y="-12" width="160" height="24" rx="6" fill="#0c182b" stroke="#7928CA" stroke-width="0.8" stroke-opacity="0.3" />
    <text x="85" y="4" text-anchor="middle" class="pill-text">🧠 Production LLMs</text>

    <!-- Pill 4: Hackapolooza '25 -->
    <rect x="180" y="-12" width="165" height="24" rx="6" fill="#0c182b" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.3" />
    <text x="262" y="4" text-anchor="middle" class="pill-text" fill="#FCD34D">🏆 Hackapolooza '25</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="30" y1="228" x2="870" y2="228" stroke="url(#cyanBlueGrad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
